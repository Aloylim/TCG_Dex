<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Tracker Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header & Search Section -->
    <header class="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-800 pb-6">
      <div>
        <h1 class="text-3xl font-bold text-indigo-400">TCG Market Tracker</h1>
        <p class="text-sm text-gray-400">Live prices from eBay and PriceCharting</p>
      </div>

      <form id="search-form" class="flex w-full md:w-auto gap-2">
        <input 
          type="text" 
          id="search-input" 
          placeholder="e.g., Charizard" 
          class="bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2 w-full md:w-80 focus:outline-none focus:border-indigo-500"
          required
        />
        <button 
          type="submit" 
          id="search-button"
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded-lg transition-colors flex items-center gap-2"
        >
          <span>Search</span>
        </button>
      </form>
    </header>

    <!-- Loading Indicator -->
    <div id="loading" class="hidden text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="text-gray-400 mt-2">Fetching market data from Apify scrapers...</p>
    </div>

    <!-- Error Message Banner -->
    <div id="error-banner" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-lg text-sm">
      Failed to retrieve pricing data. Make sure your local Express server is running on port 5001.
    </div>

    <!-- Results Display -->
    <main id="results-container" class="space-y-8">
      
      <!-- PriceCharting Summary Section -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-indigo-300">PriceCharting Estimated Values</h2>
        <div id="pricecharting-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <!-- eBay Recent Sales Table -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-indigo-300">eBay Recent Sales</h2>
        <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-700/50 text-gray-400 uppercase text-xs">
              <tr>
                <th class="p-3">Item Title</th>
                <th class="p-3">Condition</th>
                <th class="p-3">Sold Date</th>
                <th class="p-3 text-right">Price</th>
              </tr>
            </thead>
            <tbody id="ebay-table-body" class="divide-y divide-gray-700">
              <!-- Populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <script>
    // Configured for local development on Port 5001
    // Update this URL once deployed to Render
    const API_BASE_URL = 'http://localhost:5001/api/search';

    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const searchButton = document.getElementById('search-button');
    const loadingEl = document.getElementById('loading');
    const errorBanner = document.getElementById('error-banner');
    const pcCardsContainer = document.getElementById('pricecharting-cards');
    const ebayTableBody = document.getElementById('ebay-table-body');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      // UI State: Loading
      loadingEl.classList.remove('hidden');
      errorBanner.classList.add('hidden');
      searchButton.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}?q=${encodeURIComponent(query)}`);
        
        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status}`);
        }

        const result = await response.json();
        renderData(result.data);

      } catch (err) {
        console.error('Fetch error:', err);
        errorBanner.classList.remove('hidden');
      } finally {
        loadingEl.classList.add('hidden');
        searchButton.disabled = false;
      }
    });

    function renderData(data) {
      // 1. Render PriceCharting Cards
      pcCardsContainer.innerHTML = '';
      if (data.pricecharting && data.pricecharting.length > 0) {
        data.pricecharting.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-gray-800 p-4 rounded-lg border border-gray-700';
          card.innerHTML = `
            <div class="text-xs text-gray-400">${item.grade}</div>
            <div class="text-xl font-bold text-white mt-1">${item.price}</div>
          `;
          pcCardsContainer.appendChild(card);
        });
      } else {
        pcCardsContainer.innerHTML = `<p class="text-gray-400 text-sm col-span-4">No PriceCharting data found.</p>`;
      }

      // 2. Render eBay Recent Sales Table
      ebayTableBody.innerHTML = '';
      if (data.ebay && data.ebay.length > 0) {
        data.ebay.forEach(item => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-gray-750 transition-colors';
          row.innerHTML = `
            <td class="p-3 font-medium text-white">${item.title}</td>
            <td class="p-3"><span class="bg-gray-700 text-gray-300 text-xs px-2 py-1 rounded">${item.badge}</span></td>
            <td class="p-3 text-gray-400">${item.date}</td>
            <td class="p-3 text-right font-semibold text-green-400">${item.price}</td>
          `;
          ebayTableBody.appendChild(row);
        });
      } else {
        ebayTableBody.innerHTML = `
          <tr>
            <td colspan="4" class="p-4 text-center text-gray-400">No eBay listings returned for this query.</td>
          </tr>
        `;
      }
    }
  </script>
</body>
</html>
