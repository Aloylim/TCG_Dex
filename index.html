<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TCG Multi-Track Price Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [query, setQuery] = useState('Pikachu Illustrator');
      const [activeTab, setActiveTab] = useState('all');
      const [isSearching, setIsSearching] = useState(false);
      const [hasSearched, setHasSearched] = useState(true);

      // Dashboard state data structure
      const mockData = {
        cardName: query || "Pikachu Illustrator",
        ebay: [
          { id: 1, title: "Pikachu Illustrator HOLO - PSA 7", price: "$125,000.00", date: "5 hours ago", badge: "PSA 7" },
          { id: 2, title: "Pikachu Illustrator HOLO - PSA 7", price: "$65,000.00", date: "5 days ago", badge: "PSA 7" },
          { id: 3, title: "Pikachu Illustrator HOLO - PSA 7", price: "$25,000.00", date: "3 weeks ago", badge: "PSA 7" },
        ],
        pricecharting: [
          { grade: "Ungraded / Raw", price: "—", change: "0.0%" },
          { grade: "PSA 8", price: "$72,000.00", change: "+3.2%" },
          { grade: "PSA 9", price: "$195,000.00", change: "+3.2%" },
          { grade: "PSA 10", price: "$125,000.00", change: "+3.2%" },
        ],
        snkrunk: [
          { id: 1, title: "Pikachu Illustrator", price: "$310,000.00", grade: "BGS 9.5 Gem Mint", date: "Yesterday" },
          { id: 2, title: "Pikachu Illustrator Holo", price: "$310,000.00", grade: "BGS 9.5 Gem Mint", date: "Yesterday" },
          { id: 3, title: "Pikachu Illustrator Holo", price: "$200,000.00", grade: "PSA 9", date: "2 weeks ago" },
        ]
      };

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        if (!query) return;
        setIsSearching(true);
        setTimeout(() => {
          setIsSearching(false);
          setHasSearched(true);
        }, 400);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar */}
          <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="h-8 w-8 bg-indigo-600 rounded-lg flex items-center justify-center font-black text-xl">
                  T
                </div>
                <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                  TCG Price Tracker
                </span>
              </div>
              <div className="flex items-center gap-4 text-xs font-medium text-slate-400">
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-amber-400"></span> eBay</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-blue-400"></span> PriceCharting</span>
                <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-purple-400"></span> SNKRUNK</span>
              </div>
            </div>
          </header>

          {/* Main Controls & Grid */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-8 space-y-8">
            <div className="space-y-4 text-center max-w-2xl mx-auto">
              <h1 className="text-4xl font-extrabold tracking-tight sm:text-5xl">
                Real-Time TCG Telemetry
              </h1>
              <p className="text-slate-400 text-sm sm:text-base">
                Cross-platform last-sold price dashboard.
              </p>
              
              <form onSubmit={handleSearchSubmit} className="relative mt-6">
                <input
                  type="text"
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search item (e.g. Pikachu Illustrator, Charizard Base Set)..."
                  className="w-full pl-5 pr-32 py-4 bg-slate-900 border border-slate-800 rounded-2xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xl text-sm sm:text-base"
                />
                <button
                  type="submit"
                  disabled={isSearching}
                  className="absolute right-2 top-2 bottom-2 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition disabled:opacity-50"
                >
                  {isSearching ? 'Searching...' : 'Search'}
                </button>
              </form>

              {/* Quick Chips */}
              <div className="flex items-center justify-center gap-2 pt-2 text-xs text-slate-400">
                <span>Suggestions:</span>
                {['Pikachu Illustrator', 'Charizard Base Set', 'Luffy Manga Alt Art'].map((chip) => (
                  <button
                    key={chip}
                    onClick={() => { setQuery(chip); setHasSearched(true); }}
                    className="px-2.5 py-1 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-md transition"
                  >
                    {chip}
                  </button>
                ))}
              </div>
            </div>

            {hasSearched && (
              <div className="space-y-6">
                {/* Active Result Banner */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900/40 p-5 border border-slate-800/80 rounded-2xl">
                  <div>
                    <span className="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Active Query</span>
                    <h2 className="text-2xl font-bold text-slate-100">{mockData.cardName}</h2>
                  </div>
                  <div className="flex gap-2">
                    {['all', 'ebay', 'pricecharting', 'snkrunk'].map((tab) => (
                      <button
                        key={tab}
                        onClick={() => setActiveTab(tab)}
                        className={`px-3 py-1.5 text-xs font-medium rounded-lg capitalize transition ${
                          activeTab === tab
                            ? 'bg-slate-800 text-white border border-slate-700'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        {tab}
                      </button>
                    ))}
                  </div>
                </div>

                {/* 3-Column Display */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

                  {/* eBay Column */}
                  {(activeTab === 'all' || activeTab === 'ebay') && (
                    <div className="bg-slate-900 border border-slate-800/90 rounded-2xl p-5 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="font-bold text-slate-100 flex items-center gap-2">
                            <span className="h-2.5 w-2.5 rounded-full bg-amber-400"></span> eBay Last Sold
                          </h3>
                        </div>
                        <div className="space-y-3">
                          {mockData.ebay.map((item) => (
                            <div key={item.id} className="p-3 bg-slate-950/60 border border-slate-800/60 rounded-xl space-y-2">
                              <p className="text-xs font-medium text-slate-200 line-clamp-2">{item.title}</p>
                              <div className="flex items-center justify-between pt-1">
                                <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono">{item.badge}</span>
                                <div className="text-right">
                                  <span className="text-sm font-bold font-mono text-emerald-400">{item.price}</span>
                                  <span className="block text-[10px] text-slate-500">{item.date}</span>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* PriceCharting Column */}
                  {(activeTab === 'all' || activeTab === 'pricecharting') && (
                    <div className="bg-slate-900 border border-slate-800/90 rounded-2xl p-5 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="font-bold text-slate-100 flex items-center gap-2">
                            <span className="h-2.5 w-2.5 rounded-full bg-blue-400"></span> PriceCharting Grade Index
                          </h3>
                        </div>
                        <div className="space-y-2.5">
                          {mockData.pricecharting.map((item, idx) => (
                            <div key={idx} className="p-3 bg-slate-950/60 border border-slate-800/60 rounded-xl flex items-center justify-between">
                              <span className="text-xs font-medium text-slate-300">{item.grade}</span>
                              <div className="text-right">
                                <span className="text-sm font-bold font-mono text-slate-100">{item.price}</span>
                                <span className="block text-[10px] font-mono text-emerald-400">{item.change}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* SNKRUNK Column */}
                  {(activeTab === 'all' || activeTab === 'snkrunk') && (
                    <div className="bg-slate-900 border border-slate-800/90 rounded-2xl p-5 flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="font-bold text-slate-100 flex items-center gap-2">
                            <span className="h-2.5 w-2.5 rounded-full bg-purple-400"></span> SNKRUNK Collectibles
                          </h3>
                        </div>
                        <div className="space-y-3">
                          {mockData.snkrunk.map((item) => (
                            <div key={item.id} className="p-3 bg-slate-950/60 border border-slate-800/60 rounded-xl space-y-2">
                              <p className="text-xs font-medium text-slate-200 line-clamp-2">{item.title}</p>
                              <div className="flex items-center justify-between pt-1">
                                <span className="text-[10px] bg-purple-950/60 text-purple-300 border border-purple-800/50 px-2 py-0.5 rounded font-mono">{item.grade}</span>
                                <div className="text-right">
                                  <span className="text-sm font-bold font-mono text-emerald-400">{item.price}</span>
                                  <span className="block text-[10px] text-slate-500">{item.date}</span>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
